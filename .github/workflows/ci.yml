name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          version: 1.45.0

      - name: Check justfile formatting
        run: just --unstable --fmt --check

      - name: Run tests
        run: just test

      - name: SPDX header check
        run: just lint

      - name: Env coverage check
        run: just coverage
        env:
          ENV_COVERAGE_TARGET: ${{ vars.ENV_COVERAGE_TARGET }}

      - name: Check JSON fixtures
        run: just check-json
