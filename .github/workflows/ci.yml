name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run tests
        run: cd tests && bash run-tests.sh

      - name: SPDX header check
        run: cd tests && bash spdx-check.sh

      - name: Env coverage check
        run: cd tests && bash coverage.sh
        env:
          ENV_COVERAGE_TARGET: ${{ vars.ENV_COVERAGE_TARGET }}
